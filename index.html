<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedtest Tool | Simple internet speed tool</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

</head>

<body>
    <main>
        <button id="startBtn">START</button>
        <div id="results">
            <div class="tile download-tile">
                <span class="type">Download:</span>
                <span class="value muted" id="downloadSpeed">0</span>
                <span class="bitrate">Mbps</span>
            </div>
            <div id="mainResults">
                <div class="tile">
                    <span class="type">Upload:</span>
                    <span class="value muted" id="uploadSpeed">0</span>
                    <span class="bitrate">Mbps</span>
                </div>
            </div>
            <div id="extraResults">
                <div class="tile">
                    <span class="type">Ping:</span>
                    <span class="value muted" id="ping">0</span>
                    <span class="bitrate">ms</span>
                </div>
                <div class="tile">
                    <span class="type">Jitter:</span>
                    <span class="value muted" id="jitter">0</span>
                    <span class="bitrate">ms</span>
                </div>
                <div class="tile">
                    <span class="type">Latency:</span>
                    <span class="value muted" id="latency">0</span>
                    <span class="bitrate">ms</span>
                </div>
            </div>
        </div>
        <div id="disclaimerHolder">
            <p id="disclaimer">This speedtest tool is not 100% accurate.</p>
            <p id="disclaimer">
                <span>For best results, use tools like</span>
                <a href="https://www.speedtest.net" target="_blank">Speedtest.net</a>
            </p>
        </div>

    </main>
    <script src="ui.js"></script>
    <script src="speedtest.js"></script>
    <script src="main.js"></script>

</body>

</html>
